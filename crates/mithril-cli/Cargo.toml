[package]
name = "mithril-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "mithril"
path = "src/main.rs"

[dependencies]
mithril-core = { path = "../mithril-core" }
mithril-front = { path = "../mithril-front" }
mithril-reassoc = { path = "../mithril-reassoc" }
mithril-net = { path = "../mithril-net" }
mithril-codegen = { path = "../mithril-codegen" }
mithril-rt = { path = "../mithril-rt" }

[target.'cfg(target_os = "linux")'.dependencies]
mithril-gpu = { path = "../mithril-gpu", optional = true }

[features]
default = ["gpu"]
# The GPU backend: Linux with the NVIDIA driver (libcuda). Without the
# driver, build with --no-default-features.
gpu = ["dep:mithril-gpu"]
